<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MYBACKLOG</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap");
    :root { --blue: #4385ff; --blue-dim: #1f3a72; --bg: #000; --panel: #0a0a0a; --border: #222; --text: #fff; --muted: #aaa; --meta-high: #66cc33; --meta-mid: #ffcc33; --meta-low: #ff3333; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      color: var(--text);
      font-family: "Space Mono", monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .shell { width: 100%; }
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 20;
      background: rgba(0,0,0,.82);
      backdrop-filter: blur(4px);
      border-bottom: 1px solid rgba(67,133,255,.16);
    }
    .topbar {
      max-width: 1440px;
      margin: 0 auto;
      padding: 8px 24px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      height: 100%;
    }
    .logo {
      font-family: "Press Start 2P", monospace;
      font-size: 1.05rem;
      letter-spacing: .5px;
    }
    .logo span { color: var(--blue); }
    .actions {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
      justify-self: end;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111;
      border: 1px solid #333;
      padding: 0 12px;
      min-width: 0;
      width: 100%;
      height: 36px;
    }
    .search:focus-within { border-color: var(--blue); }
    .search input {
      width: 100%;
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 10px 0;
      outline: none;
      font: inherit;
      font-size: 13px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      border: 0;
      transition: transform .15s ease, opacity .15s ease, background-color .15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-login {
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
    }
    .btn-login:hover { color: var(--text); }
    .btn-signup {
      background: var(--blue);
      color: #000;
      padding: 8px 18px;
      box-shadow: 2px 2px 0 rgba(255,255,255,.1);
    }
    .btn-signup:hover { background: #2b6bf0; }
    main { max-width: 1440px; margin: 0 auto; padding: 78px 32px 48px; }
    .row { margin-top: 0; }
    .games-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 22px;
    }
    .game-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform .2s ease;
    }
    .game-card:hover { transform: translateY(-6px); }
    .cover-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 4px;
      overflow: hidden;
      background: #111;
      border: 1px solid var(--border);
      box-shadow: 0 6px 15px rgba(0,0,0,.8);
    }
    .cover-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .game-card:hover .cover-wrapper img { opacity: .88; }
    .metacritic {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      padding: 4px 8px;
      font-weight: 700;
      font-size: 13px;
      border-radius: 4px;
      border: 2px solid;
      box-shadow: 0 4px 6px rgba(0,0,0,.9);
    }
    .meta-high { color: var(--meta-high); border-color: var(--meta-high); }
    .meta-mid { color: var(--meta-mid); border-color: var(--meta-mid); }
    .meta-low { color: var(--meta-low); border-color: var(--meta-low); }
    .game-title {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ccc;
    }
    .pager {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #pagerButtons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .pager button {
      width: 40px;
      height: 40px;
      background: #0f2a57;
      color: var(--text);
      border: 1px solid #1e4d9c;
      box-shadow: 2px 2px 0 rgba(67,133,255,.15);
      cursor: pointer;
      font-weight: 700;
    }
    .pager button.active {
      background: var(--blue);
      color: #000;
    }
    .pager button:disabled { opacity: .35; cursor: not-allowed; }
    .pager-info { display: none; }
    .status {
      margin-top: 18px;
      color: var(--muted);
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="topbar">
        <div class="logo">MY<span>BACKLOG</span></div>
        <div class="actions">
          <div class="search">
            <input id="searchInput" type="text" placeholder="Buscar jogos..." />
          </div>
          <a class="btn btn-login" href="/login">Log In</a>
          <a class="btn btn-signup" href="/signup">Sign Up</a>
        </div>
      </div>
    </header>

    <main>
      <section class="row">
        <div id="gamesContainer" class="games-container"></div>
        <div class="pager">
          <div id="pagerButtons"></div>
        </div>
        <div id="status" class="status"></div>
      </section>
    </main>
  </div>

  <script>
    const container = document.getElementById("gamesContainer");
    const statusEl = document.getElementById("status");
    const pagerButtons = document.getElementById("pagerButtons");
    const searchInput = document.getElementById("searchInput");
    let currentPage = 0;
    let totalPages = 0;

    function coverUrl(rawUrl) {
      if (!rawUrl) return "https://placehold.co/300x400/111111/4385ff?text=No+Cover";
      return rawUrl.startsWith("//") ? "https:" + rawUrl : rawUrl;
    }

    function metaClass(score) {
      if (score == null) return "meta-low";
      if (score >= 80) return "meta-high";
      if (score >= 60) return "meta-mid";
      return "meta-low";
    }

    function render(games) {
      container.innerHTML = "";
      games.forEach(function (game) {
        const card = document.createElement("a");
        card.className = "game-card";
        card.href = "/games/search/" + encodeURIComponent(game.gameName);
        card.innerHTML = [
          '<div class="cover-wrapper">',
          '<img src="' + coverUrl(game.coverUrl) + '" alt="' + game.gameName + '">',
          '<div class="metacritic ' + metaClass(game.metacritic) + '">' + (game.metacritic == null ? "--" : game.metacritic) + '</div>',
          '</div>',
          '<div class="game-title">' + game.gameName + '</div>'
        ].join("");
        container.appendChild(card);
      });
    }

    function renderPager() {
      pagerButtons.innerHTML = "";
      for (let i = 0; i < totalPages; i++) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = String(i + 1);
        if (i === currentPage) {
          button.className = "active";
        }
        button.disabled = i === currentPage;
        button.addEventListener("click", function () {
          loadPage(i);
        });
        pagerButtons.appendChild(button);
      }
    }

    async function loadPage(page) {
      statusEl.textContent = "Carregando...";
      try {
        const response = await fetch("/games/search/metacritic?ordering=-aggregated_rating&page=" + page + "&size=12", { credentials: "same-origin" });
        if (!response.ok) {
          throw new Error("Falha ao carregar os jogos.");
        }
        const data = await response.json();
        currentPage = data.number || 0;
        totalPages = data.totalPages || 0;
        render(data.content || []);
        renderPager();
        statusEl.textContent = "";
      } catch (error) {
        statusEl.textContent = error.message;
        container.innerHTML = "";
        pagerButtons.innerHTML = "";
      }
    }

    searchInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        window.location.href = "/games/search/" + encodeURIComponent(searchInput.value.trim());
      }
    });

    loadPage(0);
  </script>
</body>
</html>
